<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
  <script src="practice.js" defer></script>
</head>
<body>
    

    <div>
        <label >First number
            <input id="num1" type="number">
        </label>
        <label >Second number
            <input id="num2" type="number">
        </label>
    </div>

    <div class="button-row" id="calculatorButtons">
        <button type="button" data-operation="add">Add (+)</button>
        <button type="button" data-operation="subtract" class="secondary">Subtract (−)</button>
        <button type="button" data-operation="multiply" class="secondary">Multiply (×)</button>
        <button type="button" data-operation="divide" class="secondary">Divide (÷)</button>
      </div>
      <p class="result" id="calculatorResult" aria-live="polite">Your result will appear here.</p>



       <!-- todo  -->
      <form id="todoForm" class="todo-form">
        <label class="sr-only" for="taskInput">Task name</label>
        <input id="taskInput" type="text" placeholder="Enter a task..." autocomplete="off">
        <button type="submit">Add Task</button>
      </form>
      <p class="helper" id="todoMessage" aria-live="polite">Add a task to get started.</p>
      <ul id="taskList" class="task-list"></ul>
      <div class="todo-footer">
        <span id="taskCount">0 tasks</span>
        <button type="button" id="clearCompleted" class="text-button">Clear completed</button>
      </div>

</body>
</html>
