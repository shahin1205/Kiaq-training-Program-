<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
       <script src="main.js" defer></script>
</head>
<body>

    <div class="container mx-auto">
        <form action="" id="form-item" class="flex flex-col ">
            <label for="id">id</label>
            <input id="id" type="number" placeholder="id" autocorrect="off">
            <label for="name">name</label>
            <input id="name" type="text" placeholder="name" autocorrect="off">
            <label for="userName">username</label>
            <input id="userName" type="text" placeholder="username" autocorrect="off">
            <label for="email">email</label> 
            <input id="email" type="text" placeholder="email" autocorrect="off">
            <label for="phone">phone</label>
            <input id="phone" type="text" placeholder="phone" autocorrect="off">
            <label for="website">website</label>
            <input id="website" type="text" placeholder="website" autocorrect="off">
            <button type="submit" class="bg-red-300">add user</button>
        </form>
    </div>

   

    <div class="container mx-auto">
        <ul id="list-item" class="grid grid-cols-4  gap-3 " >
            
        </ul>
    </div>
</body>
</html>
